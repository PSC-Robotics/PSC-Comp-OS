# PSC Robotics access point configuration.
# This allows the robot to create a local hotspot when an appropriate Wi-Fi
# interface is present. The bridge matches the dnsmasq and system networking
# configuration already used by the image.

interface=wlan0
bridge=br0
driver=nl80211
country_code=GB
ssid=PSC-Robot
hw_mode=g
channel=6
ieee80211d=1
auth_algs=1
wpa=2
wpa_passphrase=robotrobot
wpa_pairwise=CCMP
rsn_pairwise=CCMP
ignore_broadcast_ssid=0
