
# WiFi hotspot address
interface br0
    static ip_address=192.168.32.1/24
    static domain_name_servers=192.168.32.1
    nohook wpa_supplicant

# wlan0 runs the robot's hotspot (hostapd). A Wi-Fi client on it as well keeps
# scanning, which starves Bluetooth on the shared radio: gamepads then fail to connect.
interface wlan0
    nohook wpa_supplicant
