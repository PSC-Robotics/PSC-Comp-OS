# PSC Robotics compatibility config.
# This file is retained so software expecting the Astoria layout can still find a
# local MQTT broker, but the image intentionally does not depend on the Student
# Robotics kit metadata service, USB-code mount workflow, or hotspot network.
#
# Custom GPIO hat wiring for the PSC robot (BCM numbers, header pins in brackets):
# - Start button: BCM 5 (pin 29), wired to GND
# - WS2812 LED chain (the first is the status LED): BCM 18 (pin 12)
# - Buzzer: pin 33 (unconfirmed; BCM 13 if that is the header pin)
# The status LED and start button are run by psc-statusd; see /etc/psc-status.toml.

[mqtt]
host = "::1"
port = 1883
enable_tls = false
force_protocol_version_3_1 = true

topic_prefix = "astoria"

[wifi]
interface = "wlan0"
bridge = "br0"
enable_wpa3 = false

[astdiskd]
ignored_mounts = [
    "/",
    "/boot",
]

[astprocd]
default_usercode_entrypoint = "robot.py"

[system]
cache_dir = "/var/srobo/cache"
initial_log_lines = [
    "%SROBO_VERSION%",
    "PSC Robotics Competition OS",
]

[env]
# No Student Robotics KCH hat: stop robot code driving its pins (used by the status LED).
SR_KCH_HAT = "0"
OPENCV_VIDEOIO_PRIORITY_GSTREAMER = "0"
OPENCV_CALIBRATIONS = "/var/lib/psc-robotics/calibrations"

