# PSC Robotics status LED (the first WS2812), buzzer and start button
# (BCM GPIO numbers, not header pins).
# After changing the buzzer or start button pin, also update the gpio= lines in
# /boot/config.txt that keep the buzzer silent while booting. Robot code can't use
# the pins set here (sr.robot3 reads this file), so restart its code after editing.

# The chain of WS2812 ("NeoPixel") LEDs.
# Wire the first LED's DIN to GPIO 18 (header pin 12, as on the Brain Board HAT)
# or GPIO 10 (header pin 19), VDD to 5V and GND to GND; chain each LED's DOUT to
# the next one's DIN. The first LED shows the robot's status;
# robot code sets the others with robot.leds.
# Restart psc-statusd after editing (robot code reads count when it starts).
[led_strip]
enabled = true
count = 2                # LEDs in the chain, including the status LED (up to 320)
pins = [18]              # 18 by PWM (the HAT); add 10 to also send it by SPI,
                         # which also takes GPIO 7, 8, 9 and 11 from robot code
status_led = true        # false: robot code controls every LED, including the first
status_brightness = 0.2  # 0 to 1; the status LED at full brightness is dazzling
brightness = 1.0         # 0 to 1, scales the colours robot code sets

[start_button]
pin = 5      # header pin 29; wire the button between this pin and GND
pull = "up"  # internal pull-up, so a press pulls the pin low

[buzzer]
pin = 13          # header pin 33
type = "passive"  # "passive" plays notes; "active" beeps at its own fixed pitch
# Volume of tones played by robot code (robot.buzzer.buzz), from 0 to 50.
# Volume is the PWM duty cycle: 50 is a passive buzzer's loudest.
code_volume = 50

# System sounds: lists of [frequency in Hz, seconds, volume 0-50].
# A frequency or volume of 0 is a silent gap. Restart psc-statusd after editing.
[buzzer.sounds]
# Waiting for the start button: A6 for 0.1s, as Student Robotics uses.
waiting = [[1760, 0.1, 15]]
# Start pressed: three rising notes (C6, E6, G6), quiet.
start = [[1047, 0.06, 8], [1319, 0.06, 8], [1568, 0.1, 8]]
# Code crashed: six fast short beeps.
crash = [
    [2093, 0.06, 15], [0, 0.06, 0], [2093, 0.06, 15], [0, 0.06, 0],
    [2093, 0.06, 15], [0, 0.06, 0], [2093, 0.06, 15], [0, 0.06, 0],
    [2093, 0.06, 15], [0, 0.06, 0], [2093, 0.06, 15], [0, 0.06, 0],
]

[mqtt]
host = "localhost"
port = 1883
